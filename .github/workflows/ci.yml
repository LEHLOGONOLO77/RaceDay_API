name: RaceDay API CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore API project
        run: dotnet restore ./RaceDay.Api.csproj

      - name: Restore test project
        run: dotnet restore ./RaceDay.Api.Tests.csproj

      - name: Build API project
        run: dotnet build ./RaceDay.Api.csproj --no-restore --configuration Release

      - name: Build test project
        run: dotnet build ./RaceDay.Api.Tests.csproj --configuration Release

      - name: Run unit tests
        run: dotnet test ./RaceDay.Api.Tests.csproj --no-build --configuration Release --verbosity normal
