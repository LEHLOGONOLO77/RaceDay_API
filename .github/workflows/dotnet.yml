name: RaceDay API CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build project
        run: dotnet build --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test --configuration Release --no-build --verbosity normal
        run: dotnet build ./RaceDay.Api/RaceDay.Api.csproj 

      - name: Run unit tests
        run: dotnet test ./RaceDay.Api.Tests/RaceDay.Api.Tests.csproj 
